<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RSVP - Nimnadi & Sadeesha</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

</head>

<body>

<div class="rsvp-page">

<div class="rsvp-container">

<h1>RSVP</h1>
<p class="rsvp-text">We are excited to see you!</p>

<form id="rsvpForm">

<input type="text" name="name" placeholder="Full Name" required>

<input type="number" name="guests" placeholder="Number of Guests" required>

<select name="attendance">
<option>Attending</option>
<option>Not Attending</option>
</select>

<textarea name="message" placeholder="Your Wishes"></textarea>

<button type="submit">Submit RSVP</button>

</form>

<a href="index.html" class="back-btn">← Back to Home</a>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
